<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Architecture: the browser script posts events to a write-ahead log that is fsynced before the request is acknowledged; one writer applies them exactly once to DuckDB. Payment webhooks are stored raw in an inbox, then turned into an idempotent ledger in SQLite. The dashboard, API and MCP server read both. All of it is one binary.">
<rect x="0.5" y="0.5" width="879" height="299" rx="18" fill="#111317" stroke="#23272f"/>
<text x="28" y="40" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">One binary, two embedded databases, nothing else</text><rect x="176" y="62" width="676" height="210" rx="16" fill="none" stroke="#c8fa3c" stroke-opacity="0.35" stroke-dasharray="5 5"/><text x="194" y="84" fill="#c8fa3c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">trckabled</text><rect x="24" y="96" width="128" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="88" y="122" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">browser</text><text x="88" y="140" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">2 KB script</text><rect x="24" y="196" width="128" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="88" y="222" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Stripe &amp; co.</text><text x="88" y="240" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">signed webhooks</text><rect x="200" y="96" width="140" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="270" y="122" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">write-ahead log</text><text x="270" y="140" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">fsync, then 202</text><rect x="372" y="96" width="140" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="442" y="122" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">one writer</text><text x="442" y="140" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">exactly once</text><rect x="544" y="96" width="140" height="56" rx="12" fill="#0b0d10" stroke="#c8fa3c" stroke-width="1.6"/><text x="614" y="122" fill="#c8fa3c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">DuckDB</text><text x="614" y="140" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">reports</text><rect x="200" y="196" width="140" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="270" y="222" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">inbox</text><text x="270" y="240" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">raw, fsync, then 200</text><rect x="372" y="196" width="140" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="442" y="222" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">ledger</text><text x="442" y="240" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">idempotent</text><rect x="544" y="196" width="140" height="56" rx="12" fill="#0b0d10" stroke="#c8fa3c" stroke-width="1.6"/><text x="614" y="222" fill="#c8fa3c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">SQLite</text><text x="614" y="240" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">money &amp; settings</text><rect x="716" y="146" width="118" height="56" rx="12" fill="#0b0d10" stroke="#3a404b" stroke-width="1.2"/><text x="775" y="172" fill="#f5f7fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">dashboard</text><text x="775" y="190" fill="#6b7482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">API · MCP</text><path d="M152 124 H200" fill="none" stroke="#c8fa3c" stroke-width="1.6" stroke-opacity="0.45"/><circle r="4" fill="#c8fa3c" opacity="0"><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M152 124 H200"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0s" repeatCount="indefinite"/></circle><path d="M340 124 H372" fill="none" stroke="#c8fa3c" stroke-width="1.6" stroke-opacity="0.45"/><circle r="4" fill="#c8fa3c" opacity="0"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M340 124 H372"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.3s" repeatCount="i