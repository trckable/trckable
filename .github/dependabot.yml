# Weekly, grouped, so updates arrive as a few pull requests rather than many.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
