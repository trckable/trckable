# Nothing secret is committed: gitleaks reads what a pull request or a push adds
# (keys, tokens, private keys, connection strings). Run by hand ("Run workflow")
# it reads the whole history. The binary is pinned to a version and its checksum
# (the gitleaks action asks organisations for a licence; the tool itself is MIT).
# Findings print the file, line and rule, never the value (--redact), and the
# same list is kept for a week as the gitleaks-report artifact.
name: secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${BASE}..${{ github.event.pull_request.head.sha }}" ;;
            push) if [ "${BEFORE#0000000}" = "$BEFORE" ]; then range="${BEFORE}..${HEAD}"; else range="${HEAD}~1..${HEAD}"; fi ;;
            *) range="" ;;
          esac
          if [ -n "$range" ]; then
            ./gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif --no-banner --log-opts="$range" .
          else
            ./gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif --no-banner .
          fi
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
