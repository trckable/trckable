# The contributor licence agreement (CLA.md): a pull request from someone who
# has not signed it gets a comment asking them to, and a failing check until
# they do. Signatures are kept in this repository, on the cla-signatures
# branch, so no outside service is involved.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target: # never checks out the pull request's code
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # the signatures file
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/trckable/trckable/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: albidudija,dependabot[bot]
