# A release: `pnpm release X.Y.Z` pushes the tag vX.Y.Z (matching VERSION, with
# a section in CHANGELOG.md), and this publishes everything from it:
#   - the image, ghcr.io/trckable/trckable :X.Y.Z and :latest, x86-64 and arm64
#   - the GitHub release, with that CHANGELOG section
#   - the npm package trckable, through npm's Trusted Publishing: npm checks
#     that this workflow built it, so no npm token is stored anywhere, and the
#     package carries a provenance statement
#   - trckable.com/docs rebuilt (the changelog), in trckable/trckable-cloud
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write # the image

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the tag, VERSION and CHANGELOG agree
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$V" = "$(tr -d '[:space:]' < VERSION)" || { echo "tag $GITHUB_REF_NAME, VERSION $(cat VERSION)"; exit 1; }
          grep -q "^## $V" CHANGELOG.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image, x86-64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.V }}
          push: true
          tags: |
            ghcr.io/trckable/trckable:${{ env.V }}
            ghcr.io/trckable/trckable:latest
      - name: GitHub release, from the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## $V" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "trckable $V" --notes-file notes.md

  npm:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Trusted Publishing (set up on npmjs.com for this workflow)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org", cache: pnpm }
      - run: npm install -g npm@11 # Trusted Publishing needs npm 11.5 or newer
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trckable build && pnpm --filter trckable test
      - name: publish (a version already on npm is left alone)
        working-directory: packages/trckable
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "trckable@$V" version >/dev/null 2>&1; then echo "trckable@$V is already on npm"; exit 0; fi
          npm publish --provenance --access public

  docs:
    needs: [release, npm]
    runs-on: ubuntu-24.04
    steps:
      - name: rebuild trckable.com/docs
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::SITE_DEPLOY_TOKEN is not set yet: deploy the site by hand (pnpm web:ship in trckable-cloud)"; exit 0; fi
          gh workflow run deploy.yml -R trckable/trckable-cloud
