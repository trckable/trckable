# A release: push a tag vX.Y.Z whose version matches VERSION and has a section
# in CHANGELOG.md. The image goes to ghcr.io/trckable/trckable (:X.Y.Z and
# :latest, for x86-64 and arm64), and a GitHub release carries that section.
# The npm package is published by hand (npm publish needs a maintainer's login).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write # the image

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the tag, VERSION and CHANGELOG agree
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$V" = "$(tr -d '[:space:]' < VERSION)" || { echo "tag $GITHUB_REF_NAME, VERSION $(cat VERSION)"; exit 1; }
          grep -q "^## $V" CHANGELOG.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image, x86-64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.V }}
          push: true
          tags: |
            ghcr.io/trckable/trckable:${{ env.V }}
            ghcr.io/trckable/trckable:latest
      - name: GitHub release, from the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## $V" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "trckable $V" --notes-file notes.md
