{{- if not .Values.secret.existingSecret }}
{{- $name := include "trckable.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "trckable.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall, like the volume: the data in it is encrypted with this key.
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret: {{ get $old "secret" | default (randAlphaNum 48 | b64enc) | quote }}
  setup-token: {{ get $old "setup-token" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
