# trckable with Docker Compose:  docker compose -f deploy/compose.yml up -d
services:
  trckable:
    image: ghcr.io/trckable/trckable:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - trckable-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/trckabled", "version"]
      interval: 30s
volumes:
  trckable-data:
