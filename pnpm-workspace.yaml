packages:
  - "tracker"
  - "e2e"
  - "packages/*"
  - "dashboard"
allowBuilds:
  esbuild: false # its install script only re-checks the prebuilt binary; never needed
overrides:
  source-map-js: ">=1.2.2" # GHSA-68fv-2mgg-jv7q; reached through vitest > vite > postcss
  happy-dom: ">=21.0.4" # incomplete fix for CVE-2026-33943; reached through vitest
  zod: ">=4.6.6" # memory exhaustion on oversized collections; reached through eslint-plugin-react-hooks
